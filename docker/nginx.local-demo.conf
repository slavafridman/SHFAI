worker_processes 1;
pid /tmp/nginx.pid;
# Upstream errors can embed request paths/queries. Do not log them in this demo.
# The process owner emits bounded, configuration-free lifecycle diagnostics.
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 5s;
    send_timeout 5s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control no-store always;
            # Location add_header disables server-level inheritance in NGINX 1.28.
            add_header X-Content-Type-Options nosniff always;
            return 200 "static frontend only; not backend readiness\n";
        }
        location = /readyz {
            proxy_pass http://127.0.0.1:4302;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream off;
            error_page 502 504 =503 @gateway_unavailable;
        }
        location = /api {
            # Keep exactly one canonical server header, including upstream errors.
            # Do not hide cache/content-type or any other upstream security header.
            proxy_hide_header X-Content-Type-Options;
            proxy_pass http://127.0.0.1:4301;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_request_buffering off;
            error_page 502 504 =503 @gateway_unavailable;
        }
        location ^~ /api/ {
            proxy_hide_header X-Content-Type-Options;
            proxy_pass http://127.0.0.1:4301;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_request_buffering off;
            error_page 502 504 =503 @gateway_unavailable;
        }
        location @gateway_unavailable {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":"DEMO_GATEWAY_UNAVAILABLE","businessOutcome":"unknown"}';
        }
        location ~ /\. { deny all; }
        location ~* \.(?:js|css)$ {
            try_files $uri =404;
            # DEV filenames need not be hashed; no immutable caching in this profile.
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~* \.(?:map|json)$ { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
