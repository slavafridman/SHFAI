worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 5s;
    send_timeout 5s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        # All paths, including readiness, API and assets, reach the same fixed
        # Docker-internal name. No variables, external resolver or SPA fallback.
        location / {
            proxy_pass http://demo:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_request_buffering off;
            error_page 502 504 =503 @gateway_unavailable;
        }
        location @gateway_unavailable {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 503 '{"error":"DEMO_INGRESS_UNAVAILABLE","businessOutcome":"unknown"}';
        }
    }
}
